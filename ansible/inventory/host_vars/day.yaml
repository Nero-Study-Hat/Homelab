
host_docker_dir: "/home/ansible/docker"

### NETWORK CENTER ###

# remember to
# - copy traefik shared ip to dns reverse proxy records
# - set tailscale acls, autoApprovers, hosts, and grants
host_networks:
  shared:
  # network_center
    - name: "{{network_center.network_backend.name}}"
      ipam_options: "{{network_center.network_backend.ipam_options}}"
      traefik_ip: "{{network_center.network_backend.ips.traefik}}"
      tailscale_ip: "{{network_center.network_backend.ips.tailscale}}"
  traefik_specific: # these containers don't have Tailscale DNS and connection-ability
  # vikunja
    - name: "{{vikunja.network_backend.name}}"
      ipam_options: "{{vikunja.network_backend.ipam_options}}"
      traefik_ip: "{{vikunja.network_backend.traefik_ips.traefik}}"
  # searxng
    - name: "{{searxng.network_backend.name}}"
      ipam_options: "{{searxng.network_backend.ipam_options}}"
      traefik_ip: "{{searxng.network_backend.traefik_ips.traefik}}"
  # monitor_outpost
    - name: "{{monitor_outpost.network_backend.name}}"
      ipam_options: "{{monitor_outpost.network_backend.ipam_options}}"
      traefik_ip: "{{monitor_outpost.network_backend.traefik_ips.traefik}}"
  tailscale_specific: # these containers are not reachable via Traefik

### TRAEFIK SERVICE SPECIFIC VARS ###

network_center:
  network_backend:
    name: "traefik_tailscale"
    ipam_options:
    - subnet: "10.110.0.0/29"
      gateway: "10.110.0.1"
    ips:
      traefik: "10.110.0.2"
      tailscale: "10.110.0.4"
      dns: "10.110.0.5"
  domains:
    main: "wiresndreams.dev"
    wildcard: "*.day.wiresndreams.dev"
    traefik: "traefik.day.wiresndreams.dev"
  dns:
    upstream_server: "10.0.0.3"
    config: |
      address=/day.wiresndreams.dev/10.110.0.2

# added to dhcp static mappings in opnsense
macvlan_network_center:
  name: "macvlan_network_center"
  parent_interface: "eth0"
  ip: "10.20.1.11"
  mac_address: "c6:19:a8:7f:0e:39"
  ipam_options:
  - subnet: "10.20.1.8/29"
    gateway: "10.20.1.9"


### MONITOR OUTPOST ###

monitor_outpost:
  name: "monitor_outpost"
  network_backend:
    name: "monitor_outpost"
    ipam_options:
    - subnet: "10.110.20.0/29"
      gateway: "10.110.20.1"
    traefik_ips:
      traefik: "10.110.20.2"
      tailscale_traefik: "10.110.20.3"
      tailscale_alloy: "10.110.20.4"
      cadvisor: "10.110.20.5"
      dns: "10.110.20.6"
  outpost_header: "day-outpost"
  traefik_scrape_addresses:
    # don't use tailscale addresses here
    - "10.110.0.2" # network center 
    - "10.110.20.3" # monitor outpost
  tailscale_scrape_addresses:
    - "100.70.0.1" # day server - network center
    - "100.80.20.1" # day server - monitor outpost traefik
    - "100.80.20.2" # day monitor - monitor outpost alloy
  domains:
    main: "day.wiresndreams.dev"
    wildcard: "*.monitor.day.wiresndreams.dev"
    traefik: "traefik.monitor.day.wiresndreams.dev"
    loki: "loki.monitor.day.wiresndreams.dev"
    loki_forward: "loki.dusk.wiresndreams.dev"
    mimir: "mimir.monitor.day.wiresndreams.dev"
    mimir_forward: "mimir.dusk.wiresndreams.dev"
    cadvisor: "cadvisor.day.wiresndreams.dev"
  dns:
    upstream_server: "10.0.0.3"
    config: |
      address=/monitor.day.wiresndreams.dev/10.110.20.3

# added to dhcp static mappings in opnsense
macvlan_monitor_outpost:
  name: "macvlan_outpost"
  parent_interface: "eth2"
  ip: "10.20.1.35"
  mac_address: "da:91:79:c6:65:b6"
  ipam_options:
  - subnet: "10.20.1.32/29"
    gateway: "10.20.1.33"

# added to dhcp static mappings in opnsense
host_alloy_macvlan:
  ip: "10.20.1.36"
  mac_address: "d6:cd:54:bc:a3:85"
  

### SEARXNG SERVICE SPECIFIC VARS ###

searxng:
  name: "searxng"
  domain: "searxng.day.wiresndreams.dev"
  network_backend:
    name: "t3_searxng"
    ipam_options:
    - subnet: "10.110.31.0/29"
      gateway: "10.110.31.1"
    traefik_ips:
      traefik: "10.110.31.3"
      searxng: "10.110.31.5"

### VIKUNJA SERVICE SPECIFIC VARS ###

vikunja:
  name: "vikunja"
  domain: "vikunja.day.wiresndreams.dev"
  network_backend:
    name: "t3_vikunja"
    ipam_options:
    - subnet: "10.110.34.0/29"
      gateway: "10.110.34.1"
    traefik_ips:
      traefik: "10.110.34.3"
      vikunja: "10.110.34.5"
