
host_docker_dir: "/home/ansible/docker"

### NETWORK CENTER ###

# remember to
# - copy traefik shared ip to dns reverse proxy records
# - set tailscale acls, autoApprovers, hosts, and grants
host_networks:
  shared:
  # network_center
    - name: "{{network_center.network_backend.name}}"
      ipam_options: "{{network_center.network_backend.ipam_options}}"
      traefik_ip: "{{network_center.network_backend.ips.traefik}}"
      tailscale_ip: "{{network_center.network_backend.ips.tailscale}}"
  traefik_specific: # these containers don't have Tailscale DNS and connection-ability
  # monitor_outpost
    - name: "{{monitor_outpost.network_backend.name}}"
      ipam_options: "{{monitor_outpost.network_backend.ipam_options}}"
      traefik_ip: "{{monitor_outpost.network_backend.traefik_ips.traefik}}"
  tailscale_specific: # these containers are not reachable via Traefik

### TRAEFIK SERVICE SPECIFIC VARS ###

network_center:
  network_backend:
    name: "traefik_tailscale"
    ipam_options:
    - subnet: "10.130.0.0/29"
      gateway: "10.130.0.1"
    ips:
      traefik: "10.130.0.2"
      tailscale: "10.130.0.4"
      dns: "10.130.0.5"
  domains:
    main: "wiresndreams.dev"
    wildcard: "*.night.wiresndreams.dev"
    traefik: "traefik.night.wiresndreams.dev"
  dns:
    upstream_server: "10.0.0.3"
    config: |
      address=/night.wiresndreams.dev/10.130.0.2

# added to dhcp static mappings in opnsense
macvlan_network_center:
  name: "macvlan_network_center"
  parent_interface: "eth0"
  ip: "10.20.3.11"
  mac_address: "fe:56:b6:04:f0:db"
  ipam_options:
  - subnet: "10.20.3.8/29"
    gateway: "10.20.3.9"


### MONITOR OUTPOST ###

monitor_outpost:
  name: "monitor_outpost"
  network_backend:
    name: "monitor_outpost"
    ipam_options:
    - subnet: "10.130.20.0/29"
      gateway: "10.130.20.1"
    traefik_ips:
      traefik: "10.130.20.2"
      tailscale_traefik: "10.130.20.3"
      tailscale_alloy: "10.130.20.4"
      cadvisor: "10.130.20.5"
      dns: "10.130.20.6"
  outpost_header: "night-outpost"
  traefik_scrape_addresses:
    # don't use tailscale addresses here
    - "10.130.0.3" # network center 
    - "10.130.20.4" # monitor outpost
  tailscale_scrape_addresses:
    - "100.70.0.3" # night server - network center
    - "100.80.20.4" # night server - monitor outpost traefik
    - "100.80.20.5" # night server - monitor outpost alloy
  domains:
    main: "night.wiresndreams.dev"
    wildcard: "*.monitor.night.wiresndreams.dev"
    traefik: "traefik.monitor.night.wiresndreams.dev"
    loki: "loki.monitor.night.wiresndreams.dev"
    loki_forward: "loki.dusk.wiresndreams.dev"
    mimir: "mimir.monitor.night.wiresndreams.dev"
    mimir_forward: "mimir.dusk.wiresndreams.dev"
  dns:
    upstream_server: "10.0.0.3"
    config: |
      address=/monitor.day.wiresndreams.dev/10.110.20.3

# added to dhcp static mappings in opnsense
macvlan_monitor_outpost:
  name: "macvlan_outpost"
  parent_interface: "eth2"
  ip: "10.20.3.35"
  mac_address: "1a:7b:14:b8:0f:5d"
  ipam_options:
  - subnet: "10.20.3.32/29"
    gateway: "10.20.3.33"

# added to dhcp static mappings in opnsense
host_alloy_macvlan:
  ip: "10.20.3.20"
  mac_address: "2a:d4:1a:0f:09:40"
  
