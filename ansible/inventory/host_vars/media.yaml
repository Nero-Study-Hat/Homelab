# media_searxng:
#   name: "searxng"
#   domain: "searxng.media.nerolab.dev"
#   t3_network: "t3_searxng"
#   tailscale_ip: "172.20.2.7"

media_searxng:
  name: "searxng"
  domain: "searxng.media.nerolab.dev"
  tailscale_ip: "172.20.2.7"
  network_backend:
    name: "t3_searxng"
    ipam_options:
    - subnet: "172.30.2.0/29"
      gateway: "172.30.2.3"
    traefik_ips:
      traefik: "172.30.2.4"
      searxng: "172.30.2.5"
