media_searxng:
  name: "searxng"
  domain: "searxng.media.nerolab.dev"
  network_backend:
    name: "t3_searxng"
    ipam_options:
    - subnet: "172.30.2.0/29"
      gateway: "172.30.2.1"
    traefik_ips:
      traefik: "172.30.2.3"
      searxng: "172.30.2.5"
