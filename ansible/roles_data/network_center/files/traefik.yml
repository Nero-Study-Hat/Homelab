api:
  dashboard: true

entryPoints:
  metrics:
    address: ":9100"
  http:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: https
          scheme: https
  https:
    address: ":443"

metrics:
  prometheus:
    entryPoint: metrics
    addEntryPointsLabels: true
    addRoutersLabels: true
    addServicesLabels: true

serversTransport:
  insecureSkipVerify: true

providers:
  docker:
    constraints: "Label(`traefik.zone.main`, `true`)"
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
  # file:
  #   filename: /config.yml

certificatesResolvers:
  desec:
    acme:
      email: nerostudyhat@protonmail.com
      storage: acme.json
      caServer: https://acme-v02.api.letsencrypt.org/directory # prod (default)
      # caServer: https://acme-staging-v02.api.letsencrypt.org/directory # staging
      dnsChallenge: 
        provider: desec
        resolvers:
          - "1.1.1.1:53"
          - "1.0.0.1:53"
        propagation:
          delayBeforeChecks: 30s  # Give deSEC time to propagate
log:
  level: DEBUG