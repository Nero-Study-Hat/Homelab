### BOILER PLATE ###
- name: Creates remote docker projects directory
  ansible.builtin.file:
    path: '{{docker_dir}}'
    state: directory

- name: Update local docker directory name variable
  ansible.builtin.set_fact:
    stack_dir: "{{ [docker_dir, project_name] | join('/') }}"

- name: Creates remote project directory
  file:
    path: '{{stack_dir}}'
    state: directory

### MAIN ###

- block: # MAIN STACk
  - name: Transfer and convert the docker compose jinja2 template
    ansible.builtin.template:
      src: "mainstack_compose.yml"
      dest: "{{stack_dir}}/compose.yml"
  - name: Transfer and convert the alloy config jinja2 template
    ansible.builtin.template:
      src: "config.alloy"
      dest: "{{stack_dir}}/config.alloy"
  - name: Copy loki-config file
    ansible.builtin.copy:
      src: "loki-config.yaml"
      dest: "{{stack_dir}}/loki-config.yaml"
    when: sub_role == "main_stack"

- block: # OUTPOST
  - name: Transfer and convert the docker compose jinja2 template
    ansible.builtin.template:
      src: "outpost_compose.yml"
      dest: "{{stack_dir}}/compose.yml"
  - name: Transfer and convert the alloy config jinja2 template
    ansible.builtin.template:
      src: "config.alloy"
      dest: "{{stack_dir}}/config.alloy"
    when: sub_role == "outpost"

### DEPLOY ###
- name: Deploy Docker Compose Stack
  community.docker.docker_compose_v2:
    project_name: '{{project_name}}'
    project_src: '{{stack_dir}}'
    files:
      - compose.yml