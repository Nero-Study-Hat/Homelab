services:

  {{project_name}}:
    image: custom/dnsmasq
    container_name: "{{project_name}}"
    expose:
      - "{{port_num}}/udp"
    networks:
      {{network_backend.name}}:
        ipv4_address: "{{network_backend.tailscale_ips.dnsmasq}}"
    volumes:
      - ./dnsmasq_image/dnsmasq.conf:/etc/dnsmasq.conf:ro
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

networks:
  {{network_backend.name}}:
    external: true