project_name: "network_stack"
docker_dir: "/home/ansible/docker"

TRAEFIK_DASHBOARD_CREDENTIALS: ""
ts_auth_key: ""
desec_api_token: ""

domains:
  traefik: "traefik.day.wiresndreams.dev"
  main: .wiresndreams.dev"
  wildcard: "*.day.wiresndreams.dev"

macvlan:
  name: ""
  parent_interface: ""
  ip: ""
  mac_address: ""
  ipam_options:
  - subnet: ""
    gateway: ""

networks:
  shared:
    - name: "traefik_tailscale"
      ipam_options:
      - subnet: "172.30.1.0/29"
        gateway: "172.30.1.2"
      traefik_ip: "172.30.1.3"
      tailscale_ip: "172.30.1.4"
      dns_ip: "default"
  traefik_specific:
    - name: "t3_nextcloud"
      ipam_options:
      - subnet: "172.30.3.0/29"
        gateway: "172.30.3.3"
      traefik_ip: "172.30.3.4"
  tailscale_specific:
    - name: "tailscale_searxng"
      ipam_options:
      - subnet: "172.30.2.0/29"
        gateway: "172.30.2.3"
      tailscale_ip: "172.30.2.4"

dns:
  upstream_server: "10.0.0.3"
  config: |
    address=/day.wiresndreams.dev/10.20.1.20